<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IBU Quizzes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: graph-paper page, one column of subject blocks, each listing its quizzes. */
:root{
  --paper:#eef2f0; --grid:#dbe3e0; --card:#fbfcfb; --ink:#17222b; --muted:#5a6872;
  --line:#c9d3d0; --accent:#0b6b8a; --accent-soft:#d6e9ef;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#11181d; --grid:#1a242a; --card:#172127; --ink:#e3ebee; --muted:#93a3ad;
  --line:#2c3a42; --accent:#4fb6d6; --accent-soft:#163541; color-scheme:dark;
}}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg,var(--grid) 1px, transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.55;
  padding:40px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px));
}
.wrap{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:20px}
h1,h2{font-family:var(--f-display); margin:0; text-wrap:balance; letter-spacing:-0.01em}
h1{font-size:clamp(2.2rem, 7vw, 3.2rem); font-weight:800; line-height:1.05}
h2{font-size:1.25rem; font-weight:700}
.eyebrow{font-family:var(--f-mono); font-size:.75rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted)}
.lede{color:var(--muted); margin:0; max-width:60ch}
.subject{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 22px; display:flex; flex-direction:column; gap:12px}
.code{font-family:var(--f-mono); font-size:.8rem; color:var(--accent); letter-spacing:.06em}
ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
a.quiz{display:flex; justify-content:space-between; gap:12px; align-items:baseline; text-decoration:none; color:var(--ink);
  border:1px solid var(--line); border-radius:10px; padding:10px 14px; transition:border-color .15s, background .15s}
a.quiz:hover, a.quiz:focus-visible{border-color:var(--accent); background:var(--accent-soft); outline:none}
a.quiz .meta{font-family:var(--f-mono); font-size:.8rem; color:var(--muted); white-space:nowrap}
.empty{color:var(--muted); font-size:.95rem; margin:0}
.downloads{display:flex; flex-wrap:wrap; gap:8px}
a.dl{font-family:var(--f-mono); font-size:.8rem; text-decoration:none; color:var(--accent);
  border:1px dashed var(--accent); border-radius:999px; padding:4px 12px; transition:background .15s}
a.dl:hover, a.dl:focus-visible{background:var(--accent-soft); outline:none}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:10px">
    <span class="eyebrow">International Burch University · 2026/2027</span>
    <h1>IBU Quizzes</h1>
    <p class="lede">Revision quizzes by course. Every question has five options, with a learn mode or an exam mode that shows the explanations at the end.</p>
  </header>
  <main id="subjects" style="display:flex;flex-direction:column;gap:16px"></main>
</div>
<script>
// New quiz: add an entry to the course's "quizzes" list.
// Each course folder is named "<code> - <name>", e.g. "IT 2001 - Web Programming".
// "file" is the path inside the course folder, e.g. "week04/quiz/reading-04.html".
// Download buttons appear by themselves for every week used in "file"; the ZIPs
// are built by .github/workflows/downloads.yml.
const SUBJECTS = [
  { code:"FENMS 0121", name:"Data Structures and Algorithms", quizzes:[{file:"week04/reading-material/reading-04-guide.html",title:"Reading 04 · Study guide",meta:"read"},{file:"week04/quiz/reading-04.html",title:"Reading 04 · Quiz",meta:"82 questions"},{file:"week04/practice-questions/practice-04.html",title:"Practice 04 · Practice questions",meta:"8 questions"}] },
  { code:"IT 2001", name:"Web Programming", quizzes:[] },
  { code:"IT 2002", name:"System Analysis and Design", quizzes:[] },
  { code:"IT 2003", name:"Ethical and Legal Issues of IT", quizzes:[] },
  { code:"IT 2004", name:"Parallel Programming", quizzes:[] },
];
const DOWNLOADS = "https://github.com/HarkeZ12/ibu/releases/download/downloads/";
const zipUrl = (code, part) => DOWNLOADS + code.replace(/ /g, "-") + "-" + part + ".zip";
const weeksOf = s => [...new Set(s.quizzes.map(q => q.file.split("/")[0]).filter(w => /^week\d+$/.test(w)))].sort();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("subjects").innerHTML = SUBJECTS.map(s => `
  <section class="subject">
    <div style="display:flex;flex-direction:column;gap:2px">
      <span class="code">${esc(s.code)}</span>
      <h2>${esc(s.name)}</h2>
    </div>
    ${s.quizzes.length
      ? `<ul>${s.quizzes.map(q => `<li><a class="quiz" href="${esc([s.code + " - " + s.name, ...q.file.split("/")].map(encodeURIComponent).join("/"))}"><span>${esc(q.title)}</span><span class="meta">${esc(q.meta)}</span></a></li>`).join("")}</ul>`
      : `<p class="empty">No quizzes yet.</p>`}
    ${weeksOf(s).length
      ? `<div class="downloads">${weeksOf(s).map(w => `<a class="dl" href="${esc(zipUrl(s.code, w))}">↓ ${esc(w.replace(/^week0*/, "Week "))} (.zip)</a>`).join("")}<a class="dl" href="${esc(zipUrl(s.code, "all"))}">↓ Whole course (.zip)</a></div>`
      : ""}
  </section>`).join("");
</script>
</body>
</html>
